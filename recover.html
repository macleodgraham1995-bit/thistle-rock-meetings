<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Thistle Rock — Recording Rescue</title>
<style>
  :root{--gold:#c9a24b;--bg:#141414;--card:#1e1e1e;--ink:#f2efe6;--mut:#9a9488;--ok:#3f9d5a;--warn:#c98a2b;--err:#c0504d;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:18px;}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid #2c2c2c;border-radius:14px;padding:16px;margin-bottom:14px}
  .big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#1a1a1a;font-size:16px;font-weight:800;margin-top:8px}
  .share{background:#2f7de1;color:#fff}
  .ghost{background:#2a2a2a;color:var(--ink)}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid #262626}
  .k{color:var(--mut)} .v{text-align:right;word-break:break-word;font-weight:700}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .p-ok{background:rgba(63,157,90,.18);color:#7fd79a}
  .p-warn{background:rgba(201,138,43,.18);color:#e0b06a}
  .p-err{background:rgba(192,80,77,.18);color:#e58c8a}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mut);max-height:220px;overflow:auto;background:#151515;padding:10px;border-radius:8px}
  .note{font-size:13px;color:var(--mut);margin-top:8px}
  b.hl{color:var(--ink)}
</style>
</head>
<body>
  <h1>Recording Rescue <span style="font-size:12px;color:var(--mut)">v3 · 22 Oct 2026</span></h1>
  <div class="sub">Lists every recording and unsaved transcript this app holds on this phone, and gets them out. Read-only: it never deletes or creates anything.</div>

  <div class="card"><div id="status"><span class="pill p-warn">Scanning…</span></div></div>
  <div id="audioList"></div>
  <div id="draftList"></div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:8px">Full device diagnostic</div>
    <pre id="diag">Running…</pre>
    <button class="big ghost" id="copyDiag">Copy diagnostic</button>
  </div>

<script>
/* v3 (2026-10-22, audit H5). The previous version looked for a single recording under the
   key 'pending', which the app stopped using in version 4, so it never found anything. It
   also opened the storage at version 1 and created nothing; where the storage did not exist
   yet (the other context, Safari versus the home-screen app, which is exactly where its own
   instructions sent people) that left an EMPTY database behind and every later recording
   in that context failed to save. This version opens the storage without a version and
   cancels the open if it would have to create it, so it can never leave anything behind. */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtMB(b){ return (b/1048576).toFixed(2)+' MB'; }
function row(k,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'; }
function openExisting(){ return new Promise((res,rej)=>{
  const q=indexedDB.open('tr_meet_safety');
  let created=false;
  q.onupgradeneeded=e=>{ created=true; try{ e.target.transaction.abort(); }catch(_){} };
  q.onsuccess=()=>{ if(created){ try{ q.result.close(); }catch(_){} res(null); } else res(q.result); };
  q.onerror=()=>{ if(created){ try{ indexedDB.deleteDatabase('tr_meet_safety'); }catch(_){} res(null); } else rej(q.error); };   // it did not exist: leave nothing behind
  q.onblocked=()=>rej(new Error('blocked - close the app and try again'));
}); }
function all(db,store){ return new Promise(res=>{ const out=[]; try{
  if(!db.objectStoreNames.contains(store)) return res(out);
  const c=db.transaction(store,'readonly').objectStore(store).openCursor();
  c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out.push({key:cur.key,val:cur.value}); cur.continue(); } else res(out); };
  c.onerror=()=>res(out); }catch(e){ res(out); } }); }
function download(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},6000); }
async function shareFile(blob,name,type,title){
  try{
    const file=new File([blob], name, {type:type||'audio/mp4'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:title||name}); return true; }
    alert('Sharing files is not available here. Use Download instead.'); return false;
  }catch(e){ if(String(e).includes('AbortError')) return false; alert('Share failed: '+e); return false; }
}
const ITEMS=[];
function fileName(v,key){
  const ext=(v.name&&v.name.includes('.'))?v.name.split('.').pop():'m4a';
  return 'TR_Recording_'+String(v.when||'').slice(0,16).replace(/[:T]/g,'-')+'_'+String(key).replace(/[^A-Za-z0-9_]/g,'')+'.'+ext;
}
(async () => {
  const diag = {when:new Date().toISOString(), origin:location.origin, url:location.href,
    standalone:(window.navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches,
    dbs:[], localStorageKeys:[], audio:[], drafts:[], errors:[]};
  try{ diag.dbs = (await indexedDB.databases?.())?.map(d=>d.name+' v'+d.version) || ['(databases() unsupported)']; }catch(e){ diag.errors.push('databases(): '+e); }
  try{ diag.localStorageKeys = Object.keys(localStorage); }catch(e){ diag.errors.push('localStorage: '+e); }
  let nAudio=0, nDraft=0;
  try{
    const db=await openExisting();
    if(db){
      const audio=(await all(db,'audio')).filter(x=>x.val&&x.val.blob);
      audio.sort((a,b)=>String(b.val.when||'').localeCompare(String(a.val.when||'')));
      $('audioList').innerHTML=audio.map(({key,val},i)=>{
        ITEMS.push({blob:val.blob,name:fileName(val,key),type:val.type});
        diag.audio.push({key:String(key), size:val.blob.size, when:val.when, processed:!!val.processed, meeting:val.meetingTitle||''});
        nAudio++;
        const live=String(key).indexOf('live_')===0;
        return '<div class="card"><div style="font-weight:800;margin-bottom:6px">'+(live?'Interrupted recording':'Recording')+' · '+fmtMB(val.blob.size)+'</div>'
          + row('Saved', val.when?new Date(val.when).toLocaleString():'unknown') + row('Meeting', val.meetingTitle||'(not processed)') + row('Key', key)
          + '<button class="big share" onclick="shareFile(ITEMS['+(ITEMS.length-1)+'].blob,ITEMS['+(ITEMS.length-1)+'].name,ITEMS['+(ITEMS.length-1)+'].type,\'Meeting recording\')">Share / Save to Files</button>'
          + '<button class="big ghost" onclick="download(ITEMS['+(ITEMS.length-1)+'].blob,ITEMS['+(ITEMS.length-1)+'].name)">Download</button></div>';
      }).join('');
      const drafts=(await all(db,'meeting')).filter(x=>x.val&&x.val.id);
      $('draftList').innerHTML=drafts.map(({key,val})=>{
        const j=new Blob([JSON.stringify(val,null,2)],{type:'application/json'});
        ITEMS.push({blob:j,name:'TR_unsaved_meeting_'+String(val.id).replace(/[^A-Za-z0-9_]/g,'')+'.json',type:'application/json'});
        diag.drafts.push({key:String(key), title:val.title, date:val.date, chars:(val.rawTranscript||'').length});
        nDraft++;
        const kind=String(key).indexOf('pend_')===0?'Meeting waiting to upload':'Unsaved transcript';
        return '<div class="card"><div style="font-weight:800;margin-bottom:6px">'+kind+'</div>'
          + row('Title', val.title||val.type||'Untitled') + row('Date', val.date||'?') + row('Transcript', (val.rawTranscript||'').length+' characters')
          + '<button class="big ghost" onclick="download(ITEMS['+(ITEMS.length-1)+'].blob,ITEMS['+(ITEMS.length-1)+'].name)">Download (JSON)</button>'
          + '<button class="big share" onclick="shareFile(ITEMS['+(ITEMS.length-1)+'].blob,ITEMS['+(ITEMS.length-1)+'].name,\'application/json\',\'Unsaved meeting\')">Share</button></div>';
      }).join('');
      db.close();
    } else diag.errors.push('no app storage in this context');
  }catch(e){ diag.errors.push('open/read: '+String(e)); }
  if(nAudio||nDraft){
    $('status').innerHTML='<span class="pill p-ok">Found '+nAudio+' recording'+(nAudio===1?'':'s')+' and '+nDraft+' unsaved transcript'+(nDraft===1?'':'s')+'</span><div class="note">Tap <b class="hl">Share / Save to Files</b> and choose OneDrive, or Mail it to yourself.</div>';
  } else {
    const other = diag.standalone ? 'Safari (the browser)' : 'the home-screen app icon';
    $('status').innerHTML='<span class="pill p-err">Nothing stored in THIS context</span><div class="note">You opened this in <b class="hl">'+(diag.standalone?'the home-screen app':'Safari')+'</b>. If you usually record from '+other+', open this page from there instead. Nothing was created here.</div>';
  }
  $('diag').textContent=JSON.stringify(diag,null,2);
})();
$('copyDiag').onclick=async()=>{ try{ await navigator.clipboard.writeText($('diag').textContent); $('copyDiag').textContent='Copied ✓'; }catch(e){ $('copyDiag').textContent='Select the text above and copy'; } };
</script>
</body>
</html>
